<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Aufbau: Handy-App, Vermittler, Relay und Chrome-Extension</title>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e50914"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a9a"/></marker>
    <style>
      .box { fill: #232323; stroke: #3a3a3a; stroke-width: 1.5; }
      .key { fill: #2a1416; stroke: #e50914; stroke-width: 1.5; }
      .frame { fill: none; stroke: #555; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h { fill: #fff; font-size: 15px; font-weight: 700; }
      .t { fill: #b3b3b3; font-size: 12.5px; }
      .s { fill: #8c8c8c; font-size: 12px; }
      .direct { stroke: #e50914; stroke-width: 3; fill: none; }
      .signal { stroke: #9a9a9a; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .relay { stroke: #9a9a9a; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="940" height="500" rx="16" fill="#141414"/>

  <!-- phone -->
  <rect class="key" x="30" y="55" width="190" height="175" rx="14"/>
  <text class="h" x="125" y="100" text-anchor="middle">Handy-App (PWA)</text>
  <text class="t" x="125" y="126" text-anchor="middle">Player · Film-Browser</text>
  <text class="t" x="125" y="146" text-anchor="middle">Suche · Profile</text>
  <text class="s" x="125" y="180" text-anchor="middle">Android-Chrome,</text>
  <text class="s" x="125" y="197" text-anchor="middle">von GitHub Pages</text>

  <!-- lanes between phone and PC -->
  <text class="t" x="392" y="80" text-anchor="middle" fill="#fff">WebRTC-Datenkanal – direkt, im WLAN lokal</text>
  <line class="direct" x1="222" y1="92" x2="563" y2="92" marker-start="url(#red)" marker-end="url(#red)"/>

  <line class="signal" x1="222" y1="150" x2="312" y2="150" marker-end="url(#grey)"/>
  <line class="signal" x1="472" y1="150" x2="563" y2="150" marker-start="url(#grey)"/>
  <rect class="box" x="312" y="127" width="160" height="46" rx="8"/>
  <text class="h" x="392" y="147" text-anchor="middle" font-size="13.5">PeerJS-Vermittler</text>
  <text class="s" x="392" y="164" text-anchor="middle">nur Verbindungsaufbau</text>

  <line class="relay" x1="222" y1="208" x2="312" y2="208" marker-start="url(#grey)" marker-end="url(#grey)"/>
  <line class="relay" x1="472" y1="208" x2="563" y2="208" marker-start="url(#grey)" marker-end="url(#grey)"/>
  <rect class="box" x="312" y="185" width="160" height="46" rx="8"/>
  <text class="h" x="392" y="205" text-anchor="middle" font-size="13.5">MQTT-Relay (HiveMQ)</text>
  <text class="s" x="392" y="222" text-anchor="middle">Fallback, AES-GCM</text>

  <!-- PC -->
  <rect class="frame" x="545" y="20" width="370" height="465" rx="14"/>
  <text class="s" x="565" y="42">PC / Mac · Chrome-Extension (Manifest V3)</text>

  <rect class="box" x="565" y="55" width="330" height="175" rx="10"/>
  <text class="h" x="730" y="100" text-anchor="middle">Offscreen-Dokument</text>
  <text class="t" x="730" y="126" text-anchor="middle">WebRTC- und Relay-Sitzungen</text>
  <text class="t" x="730" y="146" text-anchor="middle">prüft den Schlüssel aus dem QR-Code</text>
  <text class="t" x="730" y="166" text-anchor="middle">und die Befehls-Whitelist</text>
  <text class="s" x="730" y="197" text-anchor="middle">bleibt verbunden, auch wenn Netflix neu lädt</text>

  <line class="relay" x1="730" y1="232" x2="730" y2="266" marker-start="url(#grey)" marker-end="url(#grey)"/>
  <rect class="box" x="565" y="268" width="330" height="54" rx="10"/>
  <text class="h" x="730" y="291" text-anchor="middle">Service Worker</text>
  <text class="t" x="730" y="310" text-anchor="middle">Tabs, Fenster-Vollbild, Routing</text>

  <line class="relay" x1="730" y1="324" x2="730" y2="366" marker-start="url(#grey)" marker-end="url(#grey)"/>
  <rect class="frame" x="565" y="342" width="330" height="128" rx="10"/>
  <text class="s" x="580" y="358">Netflix-Tab</text>
  <rect class="box" x="585" y="368" width="290" height="44" rx="8"/>
  <text class="h" x="730" y="387" text-anchor="middle" font-size="13.5">Content-Script</text>
  <text class="s" x="730" y="403" text-anchor="middle">Katalog lesen und steuern, Zustand senden</text>
  <rect class="box" x="585" y="418" width="290" height="44" rx="8"/>
  <text class="h" x="730" y="437" text-anchor="middle" font-size="13.5">page.js (MAIN world)</text>
  <text class="s" x="730" y="453" text-anchor="middle">interne Netflix-Player-API</text>

  <!-- legend -->
  <g transform="translate(30 290)">
    <text class="h" x="0" y="0">So läuft eine Verbindung</text>
    <text class="t" x="0" y="28">1. Popup zeigt QR-Code mit geheimem Schlüssel (im #-Teil).</text>
    <text class="t" x="0" y="50">2. Handy und PC finden sich über den Vermittler.</text>
    <text class="t" x="0" y="72">3. Befehle und Zustand laufen direkt per WebRTC …</text>
    <text class="t" x="0" y="94">4. … oder verschlüsselt über den Relay (Hotel-WLAN).</text>
    <text class="s" x="0" y="124">Bilder lädt das Handy direkt vom Netflix-CDN.</text>
    <line class="direct" x1="0" y1="152" x2="36" y2="152"/><text class="s" x="44" y="156">direkt</text>
    <line class="signal" x1="110" y1="152" x2="146" y2="152"/><text class="s" x="154" y="156">Aufbau</text>
    <line class="relay" x1="222" y1="152" x2="258" y2="152"/><text class="s" x="266" y="156">Relay / intern</text>
  </g>
</svg>
