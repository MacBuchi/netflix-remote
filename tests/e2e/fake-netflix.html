<!doctype html>
<html>
<head><meta charset="utf-8"><title>Netflix</title></head>
<body>
    <!-- Minimal stand-in for netflix.com, served for every netflix.com URL: the internal player API,
         the data-uia hooks and a Netflix-like markup for browse rows, profiles, search and title details. -->
    <script>
        const path = location.pathname;
        const params = new URLSearchParams(location.search);
        // Images are long signed Netflix CDN links like the real ones (the catalog gets big enough to need relay
        // chunking). The test blocks them, or answers them with placeholder posters named after `t` for screenshots.
        const img = (name, id = '0') =>
            `https://occ-0-1234-5678.1.nflxso.net/dnm/api/v6/6gmvu2hxdfnQ55LZZjyzYR4kzGk/AAAABQ${id}${'x'.repeat(180)}.jpg?r=${'a'.repeat(40)}&t=${encodeURIComponent(name)}`;

        if (path.startsWith('/watch/')) {
            document.body.innerHTML = `
                <video></video>
                <div data-uia="video-title"><h4>Nachtfalter</h4><span>S1:E3</span><span>Geheimnisse</span></div>`;
        } else if (path.startsWith('/browse') && !sessionStorage.getItem('profile') && !params.has('jbv')) {
            document.body.innerHTML = `<ul class="choose-profile">
                ${['Alex', 'Kinder'].map((n) => `<li><a class="profile-link" data-uia="profile-link" href="#"><img src="${img(n)}"><span class="profile-name">${n}</span></a></li>`).join('')}
            </ul>`;
            document.querySelectorAll('[data-uia="profile-link"]').forEach((a) =>
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    sessionStorage.setItem('profile', a.textContent.trim());
                    location.reload();
                }),
            );
        } else {
            const card = (id, name, progress) => `<div class="slider-item"><div class="title-card-container"><div class="title-card">
                <a href="/watch/${id}?tctx=0" aria-label="${name}"><div class="boxart-container"><img class="boxart-image" src="${img(name, id)}"></div></a>
                ${progress ? `<div class="progress"><span class="progress-bar"><span class="progress-completed" style="width: ${progress}%"></span></span></div>` : ''}
            </div></div></div>`;
            // The account menu in the header offers a profile switcher on every browse page.
            const header = `<div class="pinning-header"><div class="account-menu"><ul class="sub-menu">
                <li class="sub-menu-item profile-link"><a data-uia="profile-link" href="/SwitchProfile?tkn=1">Alex</a></li>
                <li class="sub-menu-item profile-link"><a data-uia="profile-link" href="/SwitchProfile?tkn=2">Kinder</a></li>
            </ul></div></div>`;
            const row = (title, items) => `<div class="lolomoRow" data-list-context="x"><h2 class="rowHeader"><div class="row-header-title">${title}</div></h2>${items.map(([id, n, p]) => card(id, n, p)).join('')}</div>`;
            if (path.startsWith('/search')) {
                const q = params.get('q');
                document.body.innerHTML = `<div class="search-gallery">${card('7001', q + ' – Film')}${card('7002', q + ' – Serie')}</div>`;
            } else {
                const filler = (r) => Array.from({ length: 30 }, (_, i) => [`${60000 + r * 100 + i}`, `Titel ${r}-${i}`]);
                document.body.innerHTML =
                    header +
                    // Billboard: full-width recommendation with title logo; Netflix plays its trailer here.
                    `<div class="billboard-row"><div class="billboard billboard-pane">
                        <div class="hero-image-wrapper"><img class="hero static-image" src="${img('Hafenlichter', '80025678')}&hero=1"></div>
                        <video class="billboard-motion"></video>
                        <button class="global-supplemental-audio-toggle" data-uia="audio-toggle-unmuted" aria-label="Ton aus"></button>
                        <div class="billboard-title"><img class="title-logo" alt="Hafenlichter" src="${img('Hafenlichter', '80025678')}&logo=1"></div>
                        <div class="billboard-description"><div class="synopsis">Eine Hafenstadt, drei Familien und ein Geheimnis, das alles verändert.</div></div>
                        <div class="billboard-links"><a class="playLink" href="/watch/80025678?trackId=1"><button data-uia="play-button">Abspielen</button></a><button data-uia="billboard-more-info">Weitere Infos</button></div>
                    </div></div>` +
                    row('Weiterschauen', [['80100172', 'Nachtfalter', 35], ['80057281', 'Sternenstaub', 70]]) +
                    row(path.includes('genre') ? 'Serien-Tipps' : 'Derzeit beliebt', [['81040344', 'Rotes Licht']]) +
                    [1, 2, 3, 4, 5].map((r) => row(`Reihe ${r}`, filler(r))).join('');
                if (params.has('jbv')) {
                    document.body.insertAdjacentHTML('beforeend', `
                        <div class="previewModal--container detail-modal" data-uia="modal-motion-container-DETAIL_MODAL">
                            <img class="previewModal--player-titleTreatment-logo" alt="Nachtfalter" src="${img('Nachtfalter')}">
                            <a data-uia="play-button" href="/watch/${params.get('jbv')}">Abspielen</a>
                            <p class="preview-modal-synopsis">Im Wald verschwindet ein Kind.</p>
                            <button data-uia="dropdown-toggle">Staffel 1</button>
                            ${['Geheimnisse', 'Lügen', 'Vergangenheit'].map((t, i) => `
                                <div class="titleCardList--container episode-item" data-uia="titleCard--container">
                                    <a href="/watch/9000${i + 1}"><img src="${img('Folge ' + (i + 1))}"></a>
                                    <div class="titleCard-title_index">${i + 1}</div>
                                    <div class="titleCard-title_text">${t}</div>
                                    <p class="titleCard-synopsis">Folge ${i + 1} von Nachtfalter.</p>
                                </div>`).join('')}
                        </div>`);
                }
            }
        }

        const audio = [{ trackId: 'a-de', displayName: 'Deutsch' }, { trackId: 'a-en', displayName: 'English' }];
        const text = [{ trackId: 't-off', displayName: 'Aus', isNoneTrack: true }, { trackId: 't-de', displayName: 'Deutsch' }];
        const fake = (window.fake = {
            t: 600000, vol: 0.5, mute: false, paused: false, skipped: 0, audio: audio[0], text: text[0],
            showSkip() {
                const b = document.createElement('button');
                b.dataset.uia = 'player-skip-intro';
                b.textContent = 'Intro überspringen';
                b.onclick = () => { fake.skipped++; b.remove(); };
                document.body.append(b);
            },
        });
        const player = {
            play: () => (fake.paused = false), pause: () => (fake.paused = true), isPaused: () => fake.paused,
            seek: (ms) => (fake.t = ms), getCurrentTime: () => fake.t, getDuration: () => 3000000,
            getVolume: () => fake.vol, setVolume: (v) => (fake.vol = v), isMuted: () => fake.mute, setMuted: (m) => (fake.mute = m),
            getAudioTrackList: () => audio, getAudioTrack: () => fake.audio, setAudioTrack: (t) => (fake.audio = t),
            getTimedTextTrackList: () => text, getTimedTextTrack: () => fake.text, setTimedTextTrack: (t) => (fake.text = t),
            setPlaybackRate: (r) => (fake.rate = r),
        };
        // Trailer preview sound toggle, like Netflix's: flips the preview video and its own data-uia.
        document.querySelectorAll('[data-uia^="audio-toggle"]').forEach((b) =>
            b.addEventListener('click', () => {
                const v = b.parentElement.querySelector('video');
                v.muted = !v.muted;
                b.dataset.uia = v.muted ? 'audio-toggle-muted' : 'audio-toggle-unmuted';
            }),
        );
        const isWatch = path.startsWith('/watch/');
        window.netflix = { appContext: { state: { playerApp: { getAPI: () => ({ videoPlayer: {
            getAllPlayerSessionIds: () => (isWatch ? ['watch-1'] : []),
            getVideoPlayerBySessionId: () => player,
        } }) } } } };
    </script>
</body>
</html>
